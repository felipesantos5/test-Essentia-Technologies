name: essentia-clinic

x-n8n-image: &n8n-image n8nio/n8n:2.39.6

x-n8n-environment: &n8n-environment
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env (run make env)}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
  TZ: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

services:
  api:
    build: ./api
    image: essentia-clinic-api:local
    environment:
      CLINIC_API_KEY: ${CLINIC_API_KEY:?set CLINIC_API_KEY in .env (run make env)}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-America/Sao_Paulo}
      CLINIC_AVAILABILITY_CACHE_TTL_SECONDS: ${CLINIC_AVAILABILITY_CACHE_TTL_SECONDS:-60}
      CLINIC_DEMO_PATIENT_EMAIL: ${CLINIC_DEMO_PATIENT_EMAIL:-}
      CLINIC_DEMO_PATIENT_NAME: ${CLINIC_DEMO_PATIENT_NAME:-Paciente Demo}
    ports:
      - "8000:8000"
    volumes:
      - api_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # One-shot: imports credentials and workflows, then publishes the workflows.
  n8n-import:
    image: *n8n-image
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      <<: *n8n-environment
      CLINIC_API_KEY: ${CLINIC_API_KEY:?set CLINIC_API_KEY in .env (run make env)}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      FORCE_WORKFLOW_SYNC: ${FORCE_WORKFLOW_SYNC:-0}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/bootstrap:/bootstrap:ro
    restart: "no"

  n8n:
    image: *n8n-image
    environment:
      <<: *n8n-environment
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_WEBHOOK_URL: http://localhost:5678/
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      api:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5678/healthz/readiness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    image: nginx:1.30-alpine
    ports:
      - "8080:80"
    volumes:
      - ./web/public:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: busybox resolves localhost to ::1 and nginx listens on IPv4.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  api_data:
  n8n_data:
