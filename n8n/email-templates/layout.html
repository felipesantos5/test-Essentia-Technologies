<!DOCTYPE html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{ $json.subject }}</title>
<!--[if mso]>
<noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<style>table, td, p, a, h1 { font-family: Arial, Helvetica, sans-serif !important; }</style>
<![endif]-->
<style>
  body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { -ms-interpolation-mode: bicubic; }
  a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }

  @media only screen and (max-width: 620px) {
    .email-container { width: 100% !important; }
    .email-px { padding-left: 24px !important; padding-right: 24px !important; }
    .email-title { font-size: 24px !important; line-height: 32px !important; }
    .email-stack { display: block !important; width: 100% !important; padding-left: 0 !important; padding-right: 0 !important; }
    .email-stack-gap { padding-top: 12px !important; }
    .email-label { width: 104px !important; }
  }
</style>
</head>
<body style="margin: 0; padding: 0; width: 100%; background-color: #eef3f2;">

<!-- Preheader: shown next to the subject in the inbox, hidden inside the message. -->
<div style="display: none; max-height: 0; overflow: hidden; mso-hide: all; font-size: 1px; line-height: 1px; color: #eef3f2; opacity: 0;">
  {{ $json.preheader }}
  &#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
  &#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
  &#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef3f2" style="background-color: #eef3f2;">
  <tr>
    <td align="center" style="padding: 32px 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #16302b;">
      <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center"><tr><td><![endif]-->
      <table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px;">

        <!-- Card -->
        <tr>
          <td bgcolor="#ffffff" style="background-color: #ffffff; border: 1px solid #d8e3e0; border-radius: 16px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

              <!-- Header -->
              <tr>
                <td align="center" bgcolor="#0b5c56" style="background-color: #0b5c56; background-image: linear-gradient(135deg, #083f3b 0%, #0f766e 100%); border-radius: 15px 15px 0 0; padding: 36px 24px 32px;">
                  <img src="%ASSETS_URL%/logo-essentia.png" width="180" height="108" alt="{{ $json.clinic_name }}" style="display: block; width: 180px; max-width: 180px; height: auto; border: 0; outline: none; text-decoration: none; color: #ffffff; font-size: 20px; font-weight: 700; line-height: 28px;">
                </td>
              </tr>

<!-- slot:content -->

            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td align="center" class="email-px" style="padding: 28px 40px 8px; font-size: 12px; line-height: 20px; color: #5c706b;">
            <p style="margin: 0; font-size: 13px; font-weight: 700; color: #16302b;">{{ $json.clinic_name }}</p>
            <p style="margin: 4px 0 0;">{{ $json.clinic_address }}</p>
            <p style="margin: 4px 0 0;">
              <a href="{{ $json.clinic_phone_href }}" style="color: #0f766e; text-decoration: none;">{{ $json.clinic_phone }}</a>
              &nbsp;&middot;&nbsp;
              <a href="mailto:{{ $json.clinic_email }}" style="color: #0f766e; text-decoration: none;">{{ $json.clinic_email }}</a>
            </p>
            <p style="margin: 16px 0 0; color: #7d8f8b;">Mensagem automática enviada pela assistente virtual da clínica.</p>
          </td>
        </tr>

      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>

</body>
</html>
